[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jds-magang"
version = "0.1.0"
description = "Vision VLM & Document Text Extractor (Structured Markdown, SQLite Tabular, & Mermaid Diagrams)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "uvicorn>=0.30",
    "dspy==3.3.1",
    "gepa==0.1.4",
    "deepagents>=0.7.5",
    "langchain>=1.3",
    "langchain-core>=1.5.6",
    "langchain-openai>=1.4",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.2",
    "pydantic>=2",
    "Pillow>=10",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "python-pptx>=1.0.2",
    "pymmdc>=0.1.0",
    "mcp>=1.0.0",
    "requests>=2",
    "streamlit>=1.40",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
