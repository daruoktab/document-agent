[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-agent"
version = "0.1.0"
description = "Vision VLM & Document Text Extractor (Structured Markdown, SQLite Tabular, & Mermaid Diagrams)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
    "dspy>=3.3.1",
    "gepa>=0.1.4",
    "deepagents>=0.7.18",
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "Pillow>=12.3.0",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-pptx>=1.0.2",
    "pymmdc>=0.1.0",
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle-gpu>=3.4.0",
    "mcp>=2.2.0",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "textreflow>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu130" }

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true
